plugins {
    id 'com.android.application'
}

android {
    namespace 'com.raseed.finance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raseed.finance.mobile'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '1.5.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
