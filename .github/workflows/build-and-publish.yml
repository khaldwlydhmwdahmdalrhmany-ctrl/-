name: Build Raseed APK and publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raseed-pages
  cancel-in-progress: false

jobs:
  publish-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static app
        run: |
          rm -rf _site
          mkdir -p _site/icons
          cp index.html app.js styles.css manifest.webmanifest sw.js _site/
          cp icons/*.png _site/icons/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Bundle the offline app files
        run: |
          mkdir -p android/app/src/main/assets/www/icons
          cp index.html app.js styles.css manifest.webmanifest sw.js android/app/src/main/assets/www/
          cp icons/*.png android/app/src/main/assets/www/icons/
      - name: Build installable debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raseed-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
