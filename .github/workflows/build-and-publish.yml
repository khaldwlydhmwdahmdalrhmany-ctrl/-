name: Build Raseed Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raseed-android-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Bundle the offline app files
        run: |
          mkdir -p android/app/src/main/assets/www/icons
          cp index.html app.js styles.css manifest.webmanifest sw.js android/app/src/main/assets/www/
          cp icons/*.png android/app/src/main/assets/www/icons/
      - name: Build installable debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raseed-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
