<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#122338" />
    <meta name="description" content="رصيد — مساحة بسيطة وواضحة لإدارة أموالك وحساباتك وديونك كفريلانسر." />
    <title>رصيد | إدارة أموالك بوضوح</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="القائمة الرئيسية">
        <a class="brand" href="#dashboard" aria-label="رصيد، الرئيسية">
          <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 12.5A3.5 3.5 0 0 1 12.5 9H30a3 3 0 0 1 3 3v2H14a5 5 0 0 0 0 10h19v3a4 4 0 0 1-4 4H12.5A3.5 3.5 0 0 1 9 27.5z" fill="currentColor"/><path d="M14 16h18a4 4 0 0 1 0 8H14a4 4 0 0 1 0-8Z" fill="#122338" stroke="currentColor" stroke-width="2.4"/><circle cx="28" cy="20" r="1.4" fill="currentColor"/></svg></span>
          <span class="brand-copy"><strong>رَصيد</strong><small>مساحتك المالية</small></span>
        </a>
        <div class="nav-caption">القائمة</div>
        <nav class="main-nav">
          <button class="nav-item active" data-page="dashboard"><span class="nav-icon" data-icon="grid"></span><span>لوحة التحكم</span></button>
          <button class="nav-item" data-page="transactions"><span class="nav-icon" data-icon="swap"></span><span>العمليات</span><span class="nav-count" id="transactionCount">0</span></button>
          <button class="nav-item" data-page="accounts"><span class="nav-icon" data-icon="wallet"></span><span>حساباتي</span></button>
          <button class="nav-item" data-page="debts"><span class="nav-icon" data-icon="people"></span><span>الديون والالتزامات</span><span class="nav-dot"></span></button>
          <button class="nav-item" data-page="reports"><span class="nav-icon" data-icon="chart"></span><span>التقارير والكشوف</span></button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-note"><span class="note-icon" data-icon="shield"></span><div><b>بياناتك تبقى لك</b><p>يُحفظ هذا النموذج على هذا الجهاز فقط.</p></div></div>
        <div class="profile"><span class="avatar">خ</span><div class="profile-copy"><strong>خالد الرحماني</strong><small>حساب شخصي</small></div><button class="icon-button profile-menu" aria-label="خيارات الحساب" data-action="profile">⋯</button></div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumbs"><span>مساحتك المالية</span><span class="crumb-sep">/</span><strong id="pageTitle">لوحة التحكم</strong></div>
          <div class="topbar-actions">
            <span class="demo-pill" id="demoPill"><i></i> بيانات توضيحية</span>
            <button class="icon-button search-button" aria-label="بحث في العمليات" data-action="search"><span data-icon="search"></span></button>
            <button class="icon-button" aria-label="الإشعارات" data-action="notifications"><span data-icon="bell"></span><i class="notification-mark"></i></button>
            <span class="topbar-divider"></span>
            <div class="today-label"><span id="todayText"></span><span data-icon="calendar"></span></div>
          </div>
        </header>
        <section id="pageContent" class="page-content" aria-live="polite"></section>
      </main>
    </div>
    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
